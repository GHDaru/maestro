name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

jobs:
  # Forcing function: toda PR deve registrar uma entrada no CHANGELOG.
  # Bypass para mudanças não voltadas ao usuário: label `skip-changelog`.
  changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG.md entry
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated ✓"
          else
            echo "::error::Toda PR deve adicionar uma entrada em [Unreleased] no CHANGELOG.md (ou aplicar o label 'skip-changelog')."
            exit 1
          fi
