name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

# Least privilege: nothing here writes to the repository, and no job needs a secret.
# Declared at the top so a job added later inherits the narrow default instead of the
# broad one (Principle III — the gate scales with what the action can reach).
permissions:
  contents: read

# The exposure is low because there is NOTHING here to steal: no secret is referenced, and
# the token cannot write. That stops being true the day a secret is added or a permission
# widens — this is the line to revisit then, not a decoration.

# push and pull_request both fire for a same-repo PR branch: without this the whole job
# runs twice per commit, npm install included.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Forcing function: toda PR deve registrar uma entrada no CHANGELOG.
  # Bypass para mudanças não voltadas ao usuário: label `skip-changelog`.
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG.md entry
        env:
          # Through env, never interpolated into the script body: this one is a SHA minted
          # by GitHub and therefore safe, but the habit is what protects the next person
          # who reaches for head_ref or a pull request title.
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$BASE"
          # Captured, never piped into `grep -q`: this shape is anti-pattern 21, and it is
          # one `set -o pipefail` away from silently reading as "no match" forever.
          changed="$(git diff --name-only "$base"...HEAD)"
          if grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo "CHANGELOG.md updated ✓"
          else
            echo "::error::Toda PR deve adicionar uma entrada em [Unreleased] no CHANGELOG.md (ou aplicar o label 'skip-changelog')."
            exit 1
          fi

  # The eleven fitness functions used to run only when an agent chose to run them — which
  # is the memory the method spent cycle 042 trying to replace (corollary C13). Here they
  # run on every push and every pull request, with no key and no per-run cost.
  gates:
    name: Fitness functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Undeclared dependency, named on purpose: check-boundary.sh and check-retro.sh shell
    # out to python3. It is preinstalled on ubuntu-latest, so this works — and would break
    # silently on a slimmer or self-hosted runner.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # check-cycle walks the history against the main line
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: publicar/package-lock.json

      # Blocking: every one of these measures a fact that does not depend on work in
      # progress. A red here means the repository is inconsistent with itself.
      - name: Structural gates (blocking)
        run: |
          fail=0
          for s in check-agents check-roles check-install check-language \
                   check-links check-evals check-boundary check-chapters \
                   check-licensing; do
            echo "── $s ──"
            scripts/"$s".sh || { echo "::error::$s failed"; fail=1; }
          done
          exit "$fail"

      - name: Plugin in sync with its sources (blocking)
        run: scripts/package-plugin.sh --verify

      - name: Book build — links, images and slugs (blocking)
        run: |
          # --ignore-scripts: the build needs the JavaScript, never a lifecycle hook.
          # markdown-it has none today; this keeps it true if one appears upstream.
          npm ci --ignore-scripts --prefix publicar
          node publicar/build.mjs

      # Advisory: these are red for legitimate reasons while work is in flight.
      # check-cycle compares against the main line; check-retro is a debt trigger by design;
      # and check-conformance rejects the placeholder qa-report.md that new-cycle.sh emits
      # ON PURPOSE, so it is red from a cycle's first commit until its last. Blocking on any
      # of the three would paint the pipeline red for the whole life of every branch — and a
      # gate that is always red is a gate people learn to scroll past, which is the failure
      # this cycle exists to prevent. Conformance is enforced where a cycle is actually
      # finished instead: scripts/promote-main.sh refuses to promote while it is red.
      - name: Cycle, retrospective debt and conformance (advisory — never blocks)
        env:
          MAESTRO_TRACE_BASE: origin/main
        run: |
          git fetch --quiet origin main:refs/remotes/origin/main 2>/dev/null || true
          for s in check-cycle check-retro check-conformance; do
            echo "── $s (advisory) ──"
            scripts/"$s".sh || echo "::warning::$s is red — advisory, read it before merging"
          done
